<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>06 Pricing Component With Toggle</title>
    <link href="./assets/css/style.css" rel="stylesheet">
    <link href="./assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="./assets/css/all.min.css" rel="stylesheet">
</head>
<body>
    <section id="main" class="position-relative min-vh-100">
        <img src="./assets/img/bg-top.svg" class="position-absolute top-0 end-0 w-25 img-fluid img-decorative">
        <img src="./assets/img/bg-bottom.svg" class="position-absolute bottom-0 start-0 w-25 img-fluid img-decorative">
        <div class="container position-relative">
            <div class="row py-5">

                <h1 class="mb-4 text-center fw-semibold text-grayish-blue fs-3">Our Pricing</h1>
                <div class="mb-5 text-center d-flex justify-content-center align-items-center" id="switch">
                    <span class="text-light-grayish-blue fw-medium">Annually</span>
                    <div class="form-check form-switch ms-2 me-3 fs-5">
                        <input class="form-check-input" type="checkbox" id="switchToggle">
                    </div>
                    <span class="text-light-grayish-blue fw-medium">Monthly</span>
                </div>

                <div class="col-xl-9 col-lg-12 col-md-7 mx-auto" id="pricing-cards">
                    <div class="row justify-content-center align-items-center px-lg-0 px-3">

                        <div class="card col-lg-4 shadow border-0 py-2 mb-lg-0 mb-4">
                            <div class="card-body">
                                <p class="card-title text-center fw-bold text-grayish-blue">Basic</p>
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item text-center fs-2 fw-bold py-0">
                                        <p class="text-dark-grayish-blue mb-2">
                                            $<span class="fs-xxxlarge" id="price-basic">19.99</span>
                                        </p>
                                    </li>
                                    <li class="list-group-item text-center fw-medium">
                                        <span class="text-grayish-blue">500 GB Storage</span>
                                    </li>
                                    <li class="list-group-item text-center fw-medium">
                                        <span class="text-grayish-blue">2 Users Allowed</span>
                                    </li>
                                    <li class="list-group-item text-center fw-medium">
                                        <span class="text-grayish-blue">Send up to 3 GB</span>
                                    </li>
                                    <li class="list-group-item text-center px-0">
                                        <button class="btn fw-medium w-100 py-2 mt-3 text-light">LEARN MORE</button>
                                    </li>
                                </ul>
                            </div>
                        </div>

                        <div class="card col-lg-4 shadow-sm border-0 py-lg-4 py-2 mb-lg-0 mb-4">
                            <div class="card-body">
                                <p class="card-title text-center fw-bold text-light">Professional</p>
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item text-center fs-2 fw-bold py-0 bg-transparent text-light">
                                        <p class="mb-2">
                                            $<span class="fs-xxxlarge" id="price-professional">24.99</span>
                                        </p>
                                    </li>
                                    <li class="list-group-item text-center fw-medium bg-transparent text-light">
                                        <span>1 TB Storage</span>
                                    </li>
                                    <li class="list-group-item text-center fw-medium bg-transparent text-light">
                                        <span>5 Users Allowed</span>
                                    </li>
                                    <li class="list-group-item text-center fw-medium bg-transparent text-light">
                                        <span>Send up to 10 GB</span>
                                    </li>
                                    <li class="list-group-item text-center bg-transparent px-0">
                                        <button class="btn fw-medium w-100 py-2 mt-3 bg-light">LEARN MORE</button>
                                    </li>
                                </ul>
                            </div>
                        </div>

                        <div class="card col-lg-4 shadow border-0 py-2 mb-lg-0 mb-4">
                            <div class="card-body">
                                <p class="card-title text-center fw-bold text-grayish-blue">Master</p>
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item text-center fs-2 fw-bold py-0">
                                        <p class="text-dark-grayish-blue mb-2">
                                            $<span class="fs-xxxlarge" id="price-master">39.99</span>
                                        </p>
                                    </li>
                                    <li class="list-group-item text-center fw-medium">
                                        <span class="text-grayish-blue">2 TB Storage</span>
                                    </li>
                                    <li class="list-group-item text-center fw-medium">
                                        <span class="text-grayish-blue">10 Users Allowed</span>
                                    </li>
                                    <li class="list-group-item text-center fw-medium">
                                        <span class="text-grayish-blue">Send up to 20 GB</span>
                                    </li>
                                    <li class="list-group-item text-center px-0">
                                        <button class="btn fw-medium w-100 py-2 mt-3 text-light">LEARN MORE</button>
                                    </li>
                                </ul>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </section>    
    




    <script src="./assets/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/main.js"></script>
</body>
</html>
