<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03 Landing Page With A Single Section </title>
    <link href="./assets/css/style.css" rel="stylesheet">
    <link href="./assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="./assets/css/all.min.css" rel="stylesheet">
</head>
<body>
    <section class="container-fluid float-start min-vh-100" id="main">
        <div class="container position-relative">
            <header>
                <div class="col-lg-2 col-md-4 col-5 mt-4 mb-5">
                    <img src="./assets/img/logo.svg" class="w-100">
                </div>
            </header>
            <div class="row">
                <div class="col-xl-7">
                    <img src="./assets/img/illustration-mockups.svg" class="w-100">
                </div>
                <div class="col-xl-5 d-xl-block d-flex flex-column align-items-center mb-5 mb-xl-0">
                    <h1 class="text-light mt-5 text-capitalize text-xl-start text-center">build the community your fans will love</h1>
                    <p class="text-light my-4 text-xl-start text-center">
                        Lorem ipsum dolor sit amet consectetur adipisicing elit. 
                        Vero laborum autem numquam vitae voluptatem, maiores tempore, 
                        voluptate possimus obcaecati recusandae cumque alias quas soluta expedita quo nihil, 
                        asperiores quisquam? Sed?
                    </p>
                    <button class="btn-custom btn btn-light px-5 py-2 rounded-pill shadow-xl">Register</button>
                </div>
                <div class="col-12 mb-5">
                    <div class="d-flex justify-content-center justify-content-xl-end float-xl-end">
                        <div class="icon-custom d-flex align-items-center justify-content-center text-light
                        border border-light rounded-circle ms-xl-2 mx-2">
                            <i class="fa-brands fa-facebook"></i>
                        </div>
                        <div class="icon-custom d-flex align-items-center justify-content-center text-light
                        border border-light rounded-circle ms-xl-2 mx-2">
                            <i class="fa-brands fa-twitter"></i>
                        </div>
                        <div class="icon-custom d-flex align-items-center justify-content-center text-light
                        border border-light rounded-circle ms-xl-2 mx-2">
                            <i class="fa-brands fa-instagram"></i>
                        </div>
                    </div> 
                </div>
            </div>
        </div>
    </section>

    
</body>
</html>
